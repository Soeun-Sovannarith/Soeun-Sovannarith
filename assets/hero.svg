    @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .ping{transform-origin:458px 262px;animation:ping 2s ease-out infinite}
    @keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
  </style>
