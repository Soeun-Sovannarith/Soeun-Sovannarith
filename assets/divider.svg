<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="0.5" stop-color="#EC4899"/><stop offset="1" stop-color="#22D3EE"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".2" stop-color="#fff"/><stop offset=".8" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="m"><rect width="1200" height="12" fill="url(#fade)"/></mask>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <g mask="url(#m)">
    <rect y="5" width="1200" height="2" rx="1" fill="url(#g)"/>
    <g><circle r="5" cy="6" fill="#EC4899" filter="url(#glow)"/><circle r="2.5" cy="6" fill="#fff"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1200 0" dur="4s" repeatCount="indefinite"/></g>
    <g><circle r="5" cy="6" fill="#22D3EE" filter="url(#glow)"/><circle r="2.5" cy="6" fill="#fff"/>
      <animateTransform attributeName="transform" type="translate" from="1200 0" to="0 0" dur="5.5s" repeatCount="indefinite"/></g>
  </g>
</svg>